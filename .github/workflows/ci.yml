name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check .

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install CPU-only torch first (--index-url only applies to one command),
      # then install everything else from PyPI.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi "uvicorn[standard]" pillow pydantic pydantic-settings \
                      python-multipart numpy httpx pytest pytest-asyncio ultralytics

      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    # Only run on push to main
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      # Create a dummy model file so COPY in Dockerfile doesn't fail
      - run: mkdir -p models && touch models/best.pt
      - name: Build Docker image
        run: docker build -t bluebin-buddy:test .
